<script>// THE LAST 10 — motion v2: human-like body mechanics for the 2D cut-out rigs (front view).

    runner('ishaan', -0.7, 19, 4.6, 2.75, 0.4, 0); runner('dev', 0.9, 21, 4.7, 3.05, 1.9, 0.15);
  } else {                            // D: Vikram runs away from camera (back view)
    title = 'D · peeche se — door daudte hue'; const u = t - 20, v = 4.8, Z = 2.6 + v * u, dist = Z - 2.6;
    A.push(actor('vikram', 0.2, Z, true, M.run(t, 0.7, { phase: dist / STRIDE_R * Math.PI * 2 })));
    for (let n = 1; n < 30; n++) { const dc = n * 0.5 * STRIDE_R; if (dc > dist) break; puffs.push({ t: 20 + dc / v, X: 0.2 + (n % 2 ? 0.12 : -0.12), Z: 2.6 + dc }); }
  }
  world(camZ, t); dust(puffs, camZ, t);
  A.sort((a, b) => b.Z - a.Z);
  for (const a of A) { const Z = a.Z - camZ; if (Z < 1) continue; const [x, y] = proj(a.X, 0, Z); if (a.k === 'ishaan') a.P.backHairFront = true; M.drawChar2(ctx, IMG, a.k, x, y, scaleAt(a.k, Z), { ...a.P, back: a.back }); }
  // shot transitions: short dips between the four shots

  ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(0, 0, W, 50); ctx.font = '600 24px "Noto Sans", sans-serif'; ctx.fillStyle = '#E9E6F0'; ctx.fillText(title, 20, 34);
  ctx.font = '500 20px "Noto Sans", sans-serif'; ctx.fillStyle = '#A79FB5'; ctx.fillText(`motion test v3 · chal + daud · ${t.toFixed(1)} s`, 1520, 34);
}
