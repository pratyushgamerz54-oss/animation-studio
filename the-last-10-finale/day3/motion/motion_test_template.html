<!doctype html><html><head><meta charset=utf-8><title>loading</title>
<style>html,body{margin:0;background:#0b0c10}canvas{display:block;width:100vw;height:auto}</style></head><body>
<canvas id=c width=1920 height=1080></canvas>
<script>/*__MOTION__*/</script>
<script>
const RIGS = /*__RIGS__*/null;
const c = document.getElementById('c'), ctx = c.getContext('2d'), M = MOTION2, DUR = 24;
const H = { aarav: 178, meera: 165, kabir: 175, zoya: 162, ryan: 180, ananya: 164, dev: 183, ishaan: 172, sara: 168, vikram: 181 };
const IMG = {};
function loadRigs() { const jobs = [];
  for (const [k, parts] of Object.entries(RIGS)) { IMG[k] = {};
    for (const [n, p] of Object.entries(parts)) { const vb = p.svg.match(/viewBox="([^"]+)"/)[1].trim().split(/[\s,]+/).map(Number); const img = new Image();
      IMG[k][n] = { img, vb, pivot: p.pivot }; jobs.push(new Promise(r => { img.onload = r; img.onerror = r; })); img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(p.svg); } }
  return Promise.all(jobs); }
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v)), sm = x => x * x * (3 - 2 * x), env = (t, a, b, i = 0.4, o = 0.4) => clamp((t - a) / i) * clamp((b - t) / o);
// fake speech for the test (mouth shapes cycling with syllable rhythm)
const talk = (t, a, b) => { if (t < a || t > b) return undefined; const s = Math.sin(t * 17) + Math.sin(t * 7.3); return s > 1 ? 'D' : s > 0.3 ? 'C' : s > -0.4 ? 'B' : 'X'; };
const CELLS = [
  { k: 'aarav', title: 'Aarav · chaal → rukna → ishaara', bg: ['#1d2633', '#0e1219'], floor: 1 },
  { k: 'kabir', title: 'Kabir · ghayal pair, langdaana', bg: ['#2a2420', '#120f0d'], floor: 1 },
  { k: 'ishaan', title: 'Ishaan · daudna', bg: ['#2b2f36', '#121417'], floor: 1 },
  { k: 'zoya', title: 'Zoya · baarish + thand (kaanpna)', bg: ['#1a2230', '#0a0e14'], rain: 1 },
  { k: 'dev', title: 'Dev · khade-khade saans, wazan, baat + dhamaka', bg: ['#2a2f22', '#11130d'] },
  { k: 'vikram', title: 'Vikram · ishaara (pehle peeche), dhamaka, chaaron taraf dekhna', bg: ['#232530', '#0d0e13'] },
];
const BLAST = 15.5;
function poseFor(k, t) {
  const seed = k.length * 1.7;
  if (k === 'aarav') { // walk, decelerate into a stop with settle, then point
    const stop = 9, w = sm(clamp((t - stop) / 0.8));
    let P = M.blend(M.walk(t, seed, { amp: 1 - 0.6 * w }), M.idle(t, seed), w);
    if (t > stop && t < stop + 1.2) { const d = t - stop; P.drop = (P.drop || 0) + Math.sin(d * 7) * Math.exp(-d * 4) * 6; }
    const g = M.gesture(t, 12.5, 16.5, { armR: [-1.35, -0.15, -0.1, 1, 1], headTilt: -0.03, turn: 0.5, brow: 2 }, P); P = M.mix(P, g);
    P.mouth = talk(t, 13, 15.6) || 'X'; return P; }
  if (k === 'kabir') return M.limp(t, seed);
  if (k === 'ishaan') return M.run(t, seed);
  if (k === 'zoya') return M.shiver(t, seed);
  let P = M.idle(t, seed);
  if (k === 'dev') { const g = M.gesture(t, 4, 10, { armR: [0.25, 2.0, 0.35, 1, 0.9], armL: [0.18, 1.6, 0.3, 1, 0.95], brow: 2 }, P);
    P = M.mix(P, g); if (t > 4 && t < 10) { P.armR = P.armR.map((v, i) => i === 1 ? v + Math.max(0, Math.sin(t * 5.5)) * 0.25 : v); P.headTilt += Math.sin(t * 5.5) * 0.02; }
    P.mouth = talk(t, 4.2, 9.8) || 'X'; }
  if (k === 'vikram') { const g = M.gesture(t, 3, 6.5, { armR: [-1.45, -0.05, 0, 1, 1], turn: 0.7, headTilt: -0.04, brow: -2 }, P); P = M.mix(P, g); P.mouth = talk(t, 3.3, 5.5) || 'X';
    if (t > 18) { const s = Math.sin((t - 18) * 1.3); P.turn = s * 0.9; P.lookX = s * 3; P.headTilt += s * 0.03; P.chestTilt += s * 0.015; } }
  const f = M.flinch(t, BLAST + (k === 'vikram' ? 0.05 : 0.1)); if (f) P = M.mix(M.blend(P, M.mix(P, f.pose), clamp(f.r + 0.001)), { shake: f.pose.shake, blink: f.pose.blink });
  return P;
}
function cell(i, t) {
  const C = CELLS[i], W = 640, Hh = 540, x0 = (i % 3) * W, y0 = Math.floor(i / 3) * Hh;
  ctx.save(); ctx.beginPath(); ctx.rect(x0, y0, W, Hh); ctx.clip(); ctx.translate(x0, y0);
  const g = ctx.createLinearGradient(0, 0, 0, Hh); g.addColorStop(0, C.bg[0]); g.addColorStop(1, C.bg[1]); ctx.fillStyle = g; ctx.fillRect(0, 0, W, Hh);
  // floor + horizon
  const fy = 470; ctx.fillStyle = 'rgba(255,255,255,.04)'; ctx.fillRect(0, 300, W, fy - 300);
  ctx.strokeStyle = 'rgba(255,255,255,.07)'; ctx.lineWidth = 2; for (let j = -6; j <= 6; j++) { ctx.beginPath(); ctx.moveTo(W / 2 + j * 18, 300); ctx.lineTo(W / 2 + j * 150, Hh); ctx.stroke(); }
  if (C.floor) { const sp = C.k === 'ishaan' ? 2.4 : C.k === 'kabir' ? 0.7 : (C.k === 'aarav' ? 1.2 * (1 - sm(clamp((t - 9) / 0.8))) : 1.2); // floor lines move toward camera
    for (let j = 0; j < 9; j++) { const z = ((j / 9 + t * sp * 0.22) % 1), y = 300 + Math.pow(z, 2.2) * (Hh - 300); ctx.strokeStyle = `rgba(255,255,255,${0.03 + z * 0.08})`; ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); } }
  // blast flash (cells 5, 6)
  if (i >= 4) { const d = t - BLAST; if (d > 0 && d < 1.5) { ctx.fillStyle = `rgba(255,170,90,${Math.max(0, 0.55 - d * 0.6)})`; ctx.fillRect(0, 0, W, Hh); } }
  const k = C.k, P = poseFor(k, t), s = 360 / 700 * H[k] / 178;
  M.drawChar2(ctx, IMG, k, W / 2, fy, s, P);
  if (C.rain) { ctx.strokeStyle = 'rgba(180,200,230,.35)'; ctx.lineWidth = 1.4; for (let j = 0; j < 90; j++) { const rx = (M.hash(j) * W + t * 60) % W, ry = (M.hash(j + 50) * Hh + t * 900) % Hh; ctx.beginPath(); ctx.moveTo(rx, ry); ctx.lineTo(rx - 4, ry + 22); ctx.stroke(); }
    // breath fog from the mouth (puffs on exhale)
    const ph = (t * 0.55) % 1; if (ph < 0.55) { const a = Math.sin(ph / 0.55 * Math.PI); const mx = W / 2 + (P.hipShift || 0) * s * 0.8 + 6, my = fy - 620 * s + (P.drop || 0) * s + 18 * s;
      const fg = ctx.createRadialGradient(mx + ph * 40, my - ph * 20, 1, mx + ph * 40, my - ph * 20, 10 + ph * 36); fg.addColorStop(0, `rgba(230,235,245,${0.35 * a})`); fg.addColorStop(1, 'rgba(230,235,245,0)'); ctx.fillStyle = fg; ctx.beginPath(); ctx.arc(mx + ph * 40, my - ph * 20, 10 + ph * 36, 0, 7); ctx.fill(); } }
  // label
  ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(0, 0, W, 44); ctx.font = '600 22px "Noto Sans", sans-serif'; ctx.fillStyle = '#E9E6F0'; ctx.fillText(C.title, 16, 30);
  ctx.restore(); ctx.strokeStyle = '#000'; ctx.lineWidth = 4; ctx.strokeRect(x0, y0, W, Hh);
}
window.draw = t => { ctx.fillStyle = '#000'; ctx.fillRect(0, 0, 1920, 1080); for (let i = 0; i < 6; i++) cell(i, t);
  ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(1640, 1040, 280, 40); ctx.font = '500 20px "Noto Sans", sans-serif'; ctx.fillStyle = '#A79FB5'; ctx.fillText(`motion test v2 · ${t.toFixed(1)} s`, 1656, 1067); };
loadRigs().then(() => { if (location.hash !== '#render') { const t0 = performance.now(); const loop = () => { draw(((performance.now() - t0) / 1000) % DUR); requestAnimationFrame(loop); }; loop(); } else draw(0); document.title = 'ready'; });
</script></body></html>
