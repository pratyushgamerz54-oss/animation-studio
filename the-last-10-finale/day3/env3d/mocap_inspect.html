<!doctype html><html><head><meta charset=utf-8><title>loading</title>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script></head><body>
<script type="module">
import * as THREE from 'three'; import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const out = [];
for (const f of ['nerd_survivor', 'Soldier']) { const g = await new GLTFLoader().loadAsync(`assets/mocap/${f}.glb`); const bones = []; g.scene.traverse(o => { if (o.isBone) bones.push(o.name); });
  const b = new THREE.Box3().setFromObject(g.scene); out.push(`${f}: height ${b.getSize(new THREE.Vector3()).y.toFixed(2)} bones(${bones.length}): ${bones.filter(n => !/Index|Middle|Ring|Pinky|Thumb|End|_end/i.test(n)).join(',')}`);
  for (const a of g.animations.filter(a => /^(Walk Forward|Run Forward|Loop Idle Default|Take Damage|Walk|Run)$/.test(a.name))) { const hip = a.tracks.filter(t => /hips?.*position/i.test(t.name));
    out.push(`  ${a.name}: dur ${a.duration.toFixed(2)} tracks ${a.tracks.length} hipPosTracks ${hip.map(t => t.name + ' z0=' + t.values[2].toFixed(2) + ' zN=' + t.values[t.values.length - 1].toFixed(2) + ' x0=' + t.values[0].toFixed(2) + ' y0=' + t.values[1].toFixed(2)).join(' ')}`); } }
console.log(out.join('\n')); document.title = 'ready';
</script></body></html>
