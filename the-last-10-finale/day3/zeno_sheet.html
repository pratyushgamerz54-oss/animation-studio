<!doctype html><html><head><meta charset=utf-8><style>html,body{margin:0;background:#0d0b12}canvas{display:block}</style></head><body>
<canvas id=c width=2400 height=1350></canvas>
<script src="zeno3d.js"></script>
<script>
const c = document.getElementById('c'), ctx = c.getContext('2d'), Z = ZENO;
// background
const bg = ctx.createLinearGradient(0, 0, 0, 1350); bg.addColorStop(0, '#1b1724'); bg.addColorStop(1, '#0c0a10'); ctx.fillStyle = bg; ctx.fillRect(0, 0, 2400, 1350);
const T = (s, x, y, size = 26, col = '#E9E6F0', w = 600, al = 'left') => { ctx.font = `${w} ${size}px "Noto Sans", sans-serif`; ctx.fillStyle = col; ctx.textAlign = al; ctx.fillText(s, x, y); };
T('ZENO', 60, 92, 64, '#F2EEF7', 800); T('Alien soldier · 3D design sheet v01 · proposal for approval', 260, 90, 28, '#A79FB5', 500);
T('THE LAST 10 — EARTH: ZERO · Day 3–10 finale', 2340, 90, 24, '#E5484D', 700, 'right');
// turnaround panel with height grid
const PX = 60, PY = 140, PW = 1460, PH = 1000; ctx.fillStyle = 'rgba(255,255,255,.03)'; ctx.fillRect(PX, PY, PW, PH);
const groundY = PY + PH - 90, mpx = 330; // px per metre
ctx.strokeStyle = 'rgba(255,255,255,.08)'; ctx.lineWidth = 1;
for (let m = 0; m <= 2.6; m += 0.5) { const y = groundY - m * mpx; ctx.beginPath(); ctx.moveTo(PX + 70, y); ctx.lineTo(PX + PW - 20, y); ctx.stroke(); T(m.toFixed(1) + ' m', PX + 12, y + 8, 18, '#6F6780', 500); }
// human scale reference (Aarav ~1.78 m) as grey silhouette
const hx = PX + 170; ctx.fillStyle = '#3b3946';
const hm = 1.78 * mpx; ctx.beginPath(); ctx.ellipse(hx, groundY - hm + hm * 0.065, hm * 0.06, hm * 0.068, 0, 0, 7); ctx.fill();
ctx.beginPath(); ctx.roundRect(hx - hm * 0.11, groundY - hm * 0.85, hm * 0.22, hm * 0.4, 14); ctx.fill();
ctx.fillRect(hx - hm * 0.1, groundY - hm * 0.47, hm * 0.085, hm * 0.47); ctx.fillRect(hx + hm * 0.015, groundY - hm * 0.47, hm * 0.085, hm * 0.47);
T('insaan 1.78 m', hx, groundY + 40, 18, '#8B8499', 600, 'center');
const soldier = Z.buildZeno({ rifle: 1 }), bare = Z.buildZeno();
const views = [['FRONT', 0], ['3/4', -0.7], ['SIDE', -Math.PI / 2], ['BACK', Math.PI]];
views.forEach(([name, yaw], i) => { const x = PX + 470 + i * 270;
  Z.render(ctx, i === 1 ? soldier : bare, { yaw, pitch: 0, dist: 60, f: 60 * mpx, cx: x, cy: groundY - 1.3 * mpx, target: [0, 1.3, 0] });
  T(name, x, groundY + 40, 20, '#C9C2D6', 700, 'center'); });
T('~2.6 m · patla, aage jhuka · digitigrade pair · lambi baahein + panje', PX + 20, PY + 40, 22, '#C9C2D6', 600);
// close-up: head + neck weak point
const box = (x, y, w, h, title) => { ctx.restore(); ctx.save(); ctx.fillStyle = 'rgba(255,255,255,.035)'; ctx.fillRect(x, y, w, h); T(title, x + 18, y + 36, 22, '#E9E6F0', 700); ctx.beginPath(); ctx.rect(x, y + 48, w, h - 110); ctx.clip(); };
ctx.save();
box(1550, 140, 380, 480, 'Sir + gardan (kamzori)');
Z.render(ctx, bare, { yaw: -1.0, pitch: 0.1, dist: 6, f: 6 * 620, cx: 1720, cy: 380, target: [0, 2.32, 0.24] });
ctx.restore(); ctx.save(); T('3 laal aankhein (visor)', 1570, 560, 18, '#FF6B6B', 600); T('neeli roshni = ship-link · yahin maaro', 1570, 590, 18, '#4FC3FF', 600);
box(1950, 140, 390, 480, 'Plasma rifle');
Z.render(ctx, Z.buildRifle(), { yaw: -0.95, pitch: 0.3, dist: 6, f: 6 * 300, cx: 2140, cy: 390, target: [0, 0.05, 0.3] });
ctx.restore(); ctx.save(); T('baingani plasma gola · do haddi jaise prong', 1970, 590, 18, '#C9A0FF', 600);
box(1550, 640, 380, 500, 'Hunter drone');
Z.render(ctx, Z.buildDrone(), { yaw: -0.5, pitch: 0.4, dist: 8, f: 8 * 230, cx: 1740, cy: 900, target: [0, 0, 0] });
ctx.restore(); ctx.save(); T('teen pankh · laal aankh · neeli thrust', 1570, 1110, 18, '#C9C2D6', 600);
box(1950, 640, 390, 500, 'Zeno Commander');
Z.render(ctx, Z.buildZeno({ commander: 1 }), { yaw: -0.5, pitch: 0.05, dist: 40, f: 40 * 150, cx: 2150, cy: 1100 - 1.5 * 150, target: [0, 1.5, 0] });
ctx.restore(); ctx.save(); T('bada · seeng ka crown · laal cape', 1970, 1110, 18, '#C9C2D6', 600);
// palette
const pal = [['armour', Z.PAL.armour], ['plates', Z.PAL.armourHi], ['skin', Z.PAL.skin], ['haddi/panje', Z.PAL.bone], ['ship-link', Z.PAL.glow], ['aankhein', Z.PAL.eye], ['plasma', Z.PAL.plasma], ['cape', Z.PAL.cape]];
pal.forEach(([n, col], i) => { const x = 60 + i * 182; ctx.fillStyle = `rgb(${col})`; ctx.fillRect(x, 1175, 160, 70);
  const hex = '#' + col.map(v => v.toString(16).padStart(2, '0')).join('').toUpperCase(); T(n, x, 1272, 18, '#C9C2D6', 600); T(hex, x, 1298, 16, '#7E778C', 500); });
T('Day 2 ship wala 3D engine · bhaari kadam, sir idhar-udhar scan, gardan ki roshni dhadakti', 1550, 1200, 19, '#A79FB5', 500);
T('Kamzori: gardan ki neeli roshni pe hit → Zeno 3 s jam (Day 6, Day 9)', 1550, 1235, 19, '#4FC3FF', 600);
document.title = 'ready';
</script></body></html>
