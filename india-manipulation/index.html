  const hop = nodes.map(() => 1e9); hop[s] = 0; const qu = [s]; while (qu.length) { const i = qu.shift(); for (const j of adj[i]) if (hop[j] > hop[i] + 1) { hop[j] = hop[i] + 1; qu.push(j); } }
